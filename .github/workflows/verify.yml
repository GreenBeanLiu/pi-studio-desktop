name: Verify

on:
  # 没人 push 也每天重跑一遍(依赖漂移、过期的测试数据也会红);n8n 的 CI 晨检 07:30 读最新结果推到手机。
  schedule:
    - cron: '30 21 * * *'  # UTC 21:30 = 北京 05:30
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      # 一个平台红了,另一个也要跑完 —— 平台分叉正是要看的东西。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      npm_config_confirm_modules_purge: 'false'
      # renderer 打出来 8MB+(mermaid / shiki 那一堆),rollup 吃内存。
      # runner 上 Node 的默认堆按可用内存推,不够用 —— macOS 上实测
      # `pnpm run build` 直接 FATAL ERROR: heap out of memory(exit 134)。
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v4
      # 不在这里钉版本:package.json 的 packageManager 已经钉了(pnpm@10.6.1),
      # 两边都写而且对不上时 action-setup@v4 会直接拒绝 —— CI 从 3e6ba1a 加上
      # packageManager 之后就一直挂在这一步,一次都没真正跑过。
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron 42 起包里没有 postinstall,二进制改成「第一次 require('electron') 时现下」。
      # vitest 并行 worker 里有两个测试文件同时 import electron(acp-connection / remote-control),
      # 两个进程一起往同一个 dist/ 解压:macOS 上无害,Windows 上 mkdir 撞车(os error 183),
      # 输掉的那个文件直接红 —— v0.13.0 / v0.17.0 / v0.18.0 首跑全是这么挂的,rerun 靠运气过。
      # 测试前在这里串行下一次;已经装好时 install.js 立即退出。
      - run: pnpm exec install-electron
      - run: pnpm run verify

  # 打包产物的启动冒烟。verify 全绿也挡不住「装好之后一点就崩」——
  # 2026-08-25 真踩过:zod 是 ACP SDK 的 peerDependency,pnpm 不把 peer 提到顶层,
  # electron-builder 只拷贝顶层看得见的包,打出来的 app 一启动就 ERR_MODULE_NOT_FOUND。
  # typecheck / lint / 测试 / build 一个都没响。
  smoke:
    needs: verify
    runs-on: macos-latest
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=6144'
      # 没有 Developer ID 就别让 electron-builder 去找签名,脚本自己打 ad-hoc。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      # 不在这里钉版本:package.json 的 packageManager 已经钉了(pnpm@10.6.1),
      # 两边都写而且对不上时 action-setup@v4 会直接拒绝 —— CI 从 3e6ba1a 加上
      # packageManager 之后就一直挂在这一步,一次都没真正跑过。
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # 只出 app 包,不做 DMG —— 冒烟要的是能启动,不是安装器。
      - run: pnpm exec electron-builder --mac dir --arm64 --publish never
      - run: node scripts/smoke-launch.mjs dist/mac-arm64/pi-studio.app --seconds 40
      - name: 失败时把 app 日志捞出来
        if: failure()
        run: cat "$HOME/Library/Application Support/pi-studio/logs/pi-studio.log" || true
